name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      bundle_path: ${{ steps.bundle.outputs.bundle_path }}
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_GOOGLE_CALENDAR_CLIENT_ID: ${{ vars.VITE_GOOGLE_CALENDAR_CLIENT_ID || secrets.VITE_GOOGLE_CALENDAR_CLIENT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Supabase env
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ] || [ -z "$VITE_GOOGLE_CALENDAR_CLIENT_ID" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing frontend variables or Supabase deployment secrets."
            echo "Add VITE_* values as repository variables and SUPABASE_ACCESS_TOKEN as a repository secret."
            exit 1
          fi

      - name: Apply Supabase migrations
        run: node scripts/deploy-supabase-migrations.mjs

      - name: Validate friends flow
        run: node scripts/validate-supabase-friends.mjs

      - name: Build
        run: npm run build

      - name: Record production bundle
        id: bundle
        run: |
          BUNDLE_PATH="$(grep -oE 'assets/index-[^\"]+\.js' dist/index.html | head -n 1)"
          if [ -z "$BUNDLE_PATH" ]; then
            echo "::error::Unable to identify the production JavaScript bundle."
            exit 1
          fi
          echo "bundle_path=$BUNDLE_PATH" >> "$GITHUB_OUTPUT"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
        with:
          timeout: 1800000

      - name: Verify the published bundle
        env:
          EXPECTED_BUNDLE: ${{ needs.build.outputs.bundle_path }}
        run: |
          SITE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          for attempt in {1..40}; do
            if curl -fsSL -H "Cache-Control: no-cache" "${SITE_URL}?verify=${GITHUB_SHA}-${attempt}" | grep -Fq "$EXPECTED_BUNDLE"; then
              echo "Published bundle verified: $EXPECTED_BUNDLE"
              exit 0
            fi
            sleep 15
          done
          echo "::error::GitHub Pages did not publish $EXPECTED_BUNDLE within 10 minutes."
          exit 1
